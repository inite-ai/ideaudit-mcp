name: Product idea
description: Something you want the ideaudit scoring tools to make possible, or a rule you think should change. Plain words are fine.
title: "idea: "
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        No engineering knowledge needed. If an AI agent helped you (`/contribute` or `/spec-idea`
        in Claude Code, or "read AGENTS.md"), paste its spec at the bottom.
        Use made-up numbers — never a real founder's figures.
  - type: textarea
    id: what
    attributes:
      label: What do you want to be possible?
      placeholder: "e.g. compute_barrier takes the number of indirect substitutes into account"
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is it for / why
      placeholder: Who needs this, and what do they do today instead?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How would you know it works?
      placeholder: An input (JSON is fine) and the output you would expect.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec (if an agent wrote one)
      description: Tool(s), input, actual vs expected output, the constant or rule involved, verdict / KILL-gate impact, out of scope.
    validations:
      required: false
